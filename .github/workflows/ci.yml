name: CI

on:
  push:
    branches: [main]
  pull_request:

# Verification needs repository contents only. Keep the automatic token
# read-only even if organization defaults are broadened later.
permissions:
  contents: read

# Documentation-only changes skip the full matrix: no code paths execute, so
# the install/lint/typecheck/test/build pipeline cannot catch anything new.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'bin/**'
              - 'lib/**'
              - 'presets/**'
              - 'cordis.patch.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'tsdown.config.ts'
              - '.github/workflows/ci.yml'

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm lint
      - run: pnpm typecheck
      # Specs sat outside every TypeScript project until tsconfig.test.json
      # existed, so a fixture could drift from the interface it fakes and never
      # fail a gate.
      - run: pnpm typecheck:tests
      # Do not retry globally: a retry can hide an order/timing regression and
      # historically did not repair deterministic cross-platform failures.
      - run: pnpm test
      - run: pnpm build

  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Publish coverage totals for trend visibility. Behavioral regression
      # tests, not a global percentage floor, are the quality gate.
      - run: pnpm test:coverage
