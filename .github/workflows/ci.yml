name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A small family of timing-sensitive panel tests trips intermittently
      # under full-suite parallel load and passes in isolation; retry keeps
      # the gate on real breakage instead of scheduler noise.
      - run: pnpm exec vitest run --retry=2
      - run: pnpm typecheck
      - run: pnpm build
