name: Release

# Only a tag push builds the tarball and attaches it to a GitHub Release.
# Pushing main runs CI tests only — it never creates a release or publishes
# to npm. npm publish stays a manual step after the registry channel is
# restored. Re-pushing the same tag, if GitHub allows it, uploads the
# tarball onto the existing release (`gh release upload --clobber`) and
# does not create a second release.

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:tests
      - run: pnpm exec vitest run --retry=2
      - run: pnpm pack --pack-destination dist
      - name: Create the GitHub release with the packed bundle
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "dsh-code $GITHUB_REF_NAME" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "dsh-code $GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
