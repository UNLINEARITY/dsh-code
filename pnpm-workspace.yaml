overrides:
  # GHSA-2883-xcg3-v3hh: every Cordis/Harness path must use the patched
  # merge-key limiter, not only this workspace's direct development copy.
  js-yaml: 4.3.2
allowBuilds:
  # esbuild ships the native binary tsdown/vitest resolve through; its install
  # script only downloads/links that binary.
  esbuild: true
  # koffi is the FFI dependency behind dsh-session-persistence-jsonl on the
  # dev/test path; its cnoke install script compiles or validates the native
  # extension from the prebuilt sources the tarball ships.
  koffi: true
